<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510">
<rect width="1200" height="510" fill="white"/>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#24292f}
.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#57606a}.label{font-size:19px}.value{font-size:18px;font-weight:700}
.axis{stroke:#8c959f;stroke-width:1}.grid{stroke:#d8dee4;stroke-width:1}.bar{fill:#0969da}.other{fill:#8c959f}
</style>
<text x="38" y="48" class="title">Who met the digital-euro negotiators?</text>
<text x="38" y="78" class="sub">309 disclosed meetings in the European Parliament transparency record</text>

<line x1="300" y1="105" x2="300" y2="455" class="axis"/>
<line x1="530" y1="105" x2="530" y2="455" class="grid"/>
<line x1="760" y1="105" x2="760" y2="455" class="grid"/>
<line x1="990" y1="105" x2="990" y2="455" class="grid"/>
<text x="294" y="480" class="sub">0</text><text x="517" y="480" class="sub">50</text><text x="742" y="480" class="sub">100</text><text x="970" y="480" class="sub">150 meetings</text>

<text x="38" y="140" class="label">Banks &amp; banking associations</text>
<rect x="300" y="116" width="547" height="32" rx="4" class="bar"/><text x="862" y="140" class="value">119</text>

<text x="38" y="205" class="label">Payment providers &amp; schemes</text>
<rect x="300" y="181" width="184" height="32" rx="4" class="bar"/><text x="499" y="205" class="value">40</text>

<text x="38" y="270" class="label">Consumer / civil society</text>
<rect x="300" y="246" width="115" height="32" rx="4" class="bar"/><text x="430" y="270" class="value">25</text>

<text x="38" y="335" class="label">Retailers</text>
<rect x="300" y="311" width="106" height="32" rx="4" class="bar"/><text x="421" y="335" class="value">23</text>

<text x="38" y="400" class="label">Large technology firms</text>
<rect x="300" y="376" width="60" height="32" rx="4" class="bar"/><text x="375" y="400" class="value">13</text>

<text x="38" y="455" class="label">Other (mostly public bodies)</text>
<rect x="300" y="431" width="409" height="24" rx="4" class="other"/><text x="724" y="451" class="value">89</text>
</svg>