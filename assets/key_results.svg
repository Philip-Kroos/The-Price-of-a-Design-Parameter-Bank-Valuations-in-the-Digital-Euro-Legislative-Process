<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570">
<rect width="1200" height="570" fill="white"/>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#24292f}
.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#57606a}
.label{font-size:19px;font-weight:600}.small{font-size:15px;fill:#57606a}.tick{font-size:14px;fill:#57606a}
.axis{stroke:#8c959f;stroke-width:1}.grid{stroke:#d8dee4;stroke-width:1}.zero{stroke:#57606a;stroke-width:2}
.ci{stroke:#57606a;stroke-width:4;stroke-linecap:round}.dot{fill:#0969da}.design{fill:#cf222e}.early{fill:#1a7f37}
</style>
<text x="38" y="48" class="title">Bank valuation effects: early project news vs. later design</text>
<text x="38" y="78" class="sub">Percentage points of abnormal return per 1 SD of bank deposit exposure</text>

<!-- plot range -1.3 to 1.6 mapped to x=350..1130 -->
<line x1="350" y1="500" x2="1130" y2="500" class="axis"/>
<line x1="699.7" y1="105" x2="699.7" y2="500" class="zero"/>
<line x1="350" y1="105" x2="350" y2="500" class="grid"/>
<line x1="484.5" y1="105" x2="484.5" y2="500" class="grid"/>
<line x1="619.0" y1="105" x2="619.0" y2="500" class="grid"/>
<line x1="753.4" y1="105" x2="753.4" y2="500" class="grid"/>
<line x1="887.9" y1="105" x2="887.9" y2="500" class="grid"/>
<line x1="1022.4" y1="105" x2="1022.4" y2="500" class="grid"/>

<text x="342" y="525" class="tick">−1.3</text><text x="474" y="525" class="tick">−0.8</text>
<text x="610" y="525" class="tick">−0.3</text><text x="745" y="525" class="tick">0.2</text>
<text x="879" y="525" class="tick">0.7</text><text x="1012" y="525" class="tick">1.2</text>

<text x="38" y="145" class="label">2020 Eurosystem report</text>
<text x="38" y="168" class="small">strictly pre-event betas</text>
<line x1="718.2" y1="150" x2="1092.4" y2="150" class="ci"/>
<circle cx="906.1" cy="150" r="9" class="early"/>
<text x="1099" y="156" class="small">+0.77</text>

<text x="38" y="245" class="label">2023–26 pre-specified</text>
<text x="38" y="268" class="small">main one-day estimate</text>
<line x1="683.6" y1="250" x2="742.7" y2="250" class="ci"/>
<circle cx="713.4" cy="250" r="9" class="dot"/>
<text x="750" y="256" class="small">+0.051</text>

<text x="38" y="345" class="label">Release-time aligned</text>
<text x="38" y="368" class="small">conservative timing specification</text>
<line x1="696.3" y1="350" x2="789.6" y2="350" class="ci"/>
<circle cx="742.9" cy="350" r="9" class="dot"/>
<text x="797" y="356" class="small">+0.161</text>

<text x="38" y="445" class="label">Design-parameter events only</text>
<text x="38" y="468" class="small">four bank-relevant design events</text>
<line x1="641.8" y1="450" x2="755.6" y2="450" class="ci"/>
<rect x="691.6" y="442" width="16" height="16" class="design"/>
<text x="763" y="456" class="small">−0.004</text>

<text x="38" y="554" class="small">Dots/square: point estimates. Lines: approximate 95% confidence intervals. Positive values agree with the model-predicted direction.</text>
</svg>